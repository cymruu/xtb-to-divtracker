name: ci

on: push

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22.x"]

    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup@v3 automatically installs version defined in `package.json`
      - uses: pnpm/action-setup@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm test
      - run: pnpm run build
      - name: prepare build
        if: github.ref == 'refs/heads/master'
        run: |
          cp node_modules/excelize-wasm/excelize.wasm.gz ./dist/
          SHA_SHORT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date +"%Y-%m-%d %H:%M:%S")
          sed -i'' -e "s/{{VERSION}}/$SHA_SHORT/" index.html
          sed -i'' -e "s/{{BUILD_TIME}}/$BUILD_TIME/" index.html
      - name: Upload build-artifacts
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            index.html

  trigger-deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: cymruu/xtb-to-divtracker/.github/workflows/deploy.yml@master
